name: Build Custom Windows App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and lint
        run: npm run lint
      - name: Run tests
        run: npm test -- --run --coverage.enabled=false
      - name: Build native iRacing addon
        run: npm run irsdk:build
      - name: Build unsigned installer
        run: npm run make -- --platform=win32 --arch=x64
      - name: Verify native addon and archive application
        shell: pwsh
        run: |
          $package = Get-ChildItem out -Directory -Filter '*-win32-x64'
          if (@($package).Count -ne 1) {
            throw 'Expected exactly one Windows application package.'
          }
          $builtAddon = 'build/Release/irsdk_node.node'
          $packagedAddon = Join-Path $package.FullName 'resources/app.asar.unpacked/.vite/build/Release/irsdk_node.node'
          if (-not (Test-Path $packagedAddon -PathType Leaf)) {
            throw 'Packaged native iRacing addon is missing.'
          }
          if ((Get-FileHash $builtAddon).Hash -ne (Get-FileHash $packagedAddon).Hash) {
            throw 'Packaged native addon does not match the build.'
          }
          Compress-Archive -Path "$($package.FullName)/*" -DestinationPath irDashies-Custom-Windows.zip
      - name: Upload installer and portable application
        uses: actions/upload-artifact@v7
        with:
          name: irDashies-Custom-Windows
          if-no-files-found: error
          path: |
            out/make/squirrel.windows/x64/*
            irDashies-Custom-Windows.zip
