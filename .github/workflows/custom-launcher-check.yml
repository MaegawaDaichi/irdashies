name: Check Custom launcher

on:
  push:
    branches: [fix/custom-launcher-process-check]
  pull_request:
    paths:
      - tools/launch-custom.mjs
      - tools/check-launch-custom.mjs
      - launch-custom.cmd
      - .github/workflows/custom-launcher-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check launcher including real PowerShell process lookup
        run: node --test tools/check-launch-custom.mjs
